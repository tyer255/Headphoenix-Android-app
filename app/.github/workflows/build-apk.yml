name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          # Detect the active Java major version
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print ($1 == "1" ? $2 : $1)}')
          
          if [ -z "$JAVA_MAJOR" ]; then
            echo "::error::Could not detect Java version."
            exit 1
          fi
          
          echo "Active Java major version detected: $JAVA_MAJOR"
          
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java version $JAVA_MAJOR is lower than required version 17."
            exit 1
          fi
          
          echo "Java environment verified: Java $JAVA_MAJOR is 17 or newer."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Existing debug.keystore found."
          else
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create or verify ./debug.keystore."
            exit 1
          fi
          
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files under app/build/outputs/apk:"
              find app/build/outputs/apk -name "*.apk"
            fi
            exit 1
          fi
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is not a regular file."
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is empty."
            exit 1
          fi
          
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "::error::$EXPECTED_APK does not have the .apk extension."; exit 1 ;;
          esac
          
          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Selected file does not match exact path app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi
          
          echo "Verified debug APK successfully: $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          # Create temporary directory inside GitHub Actions runner
          RUNNER_TMP_DIR=$(mktemp -d -t apk-release-XXXXXX)
          
          # Sanitize repository name
          REPO_RAW="${GITHUB_REPOSITORY#*/}"
          REPO_SAFE=$(echo "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9_-]/-/g' -e 's/--*/-/g' -e 's/^-//' -e 's/-$//')
          if [ -z "$REPO_SAFE" ]; then
            REPO_SAFE="android-app"
          fi
          
          RELEASE_FILENAME="${REPO_SAFE}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          DEST_PATH="${RUNNER_TMP_DIR}/${RELEASE_FILENAME}"
          
          # Copy verified APK into the temporary directory
          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEST_PATH"
          
          if [ ! -s "$DEST_PATH" ]; then
            echo "::error::Failed to copy or verify release asset at $DEST_PATH"
            exit 1
          fi
          
          echo "Prepared release asset: $DEST_PATH"
          echo "asset_path=$DEST_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_filename=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_filename }}
        run: |
          # Verify GitHub CLI availability
          gh --version
          
          # Validate release asset
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ]; then
            echo "::error::Release asset does not exist at $ASSET_PATH"
            exit 1
          fi
          
          if [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset $ASSET_PATH is empty."
            exit 1
          fi
          
          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "::error::Release asset $ASSET_PATH is not a .apk file"; exit 1 ;;
          esac
          
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Android Music App - Build #${GITHUB_RUN_NUMBER}"
          
          APK_SIZE=$(du -h "$ASSET_PATH" | awk '{print $1}')
          APK_SHA256=$(sha256sum "$ASSET_PATH" | awk '{print $1}')
          
          cat << 'EOF' > release_notes.md
## 📱 Android Debug Build Release

Welcome to the latest automated build! You can directly install this APK on your Android device to test all current features and performance optimizations.

---

### 📦 Download & Package Details

| Asset | Target Architecture | File Size | SHA-256 Checksum |
| :--- | :--- | :--- | :--- |
| **`__ASSET_NAME__`** | Universal (`arm64-v8a` / `armeabi-v7a` / `x86_64`) | `__APK_SIZE__` | `__APK_SHA256__` |

---

### ✨ Highlights & Features in this Build

- 🎵 **Lossless Music Player**: Clean playback engine, synchronized real-time lyrics teaser & full lyrics viewer.
- 🖼️ **Up Next Queue Thumbnails**: 4-album horizontal queue preview with zero-layout-shift skeleton loading placeholders.
- ⚡ **120 FPS High Performance**: Zero-overhead GPU gradient backgrounds for stutter-free scrolling on high refresh rate screens.
- 📥 **Offline Downloads**: Local download manager allowing full offline music listening without WiFi/Data.
- 🎛️ **Audio Control Tools**: Variable speed controls (0.5x - 2.0x), sleep timer, playlist creator, and background MediaSession notification controls.

---

### 📲 How to Install on Android

1. **Download**: Tap the `.apk` file attached below under **Assets**.
2. **Open**: Once downloaded, open the notification or find the file in your device's **Downloads** folder.
3. **Allow Permission**: If Android displays *"For your security, your phone is not allowed to install unknown apps"*, tap **Settings** and enable **"Allow from this source"**.
4. **Install**: Tap **Install** and launch the app.

---

### 🛠️ Build & Verification Metadata

- **Build Number**: `__RUN_NUMBER__` (Attempt: `__RUN_ATTEMPT__`)
- **Commit SHA**: `__GIT_SHA__`
- **Toolchain**: Temurin Java 17 | Gradle 9.3.1 | Android AGP 9.1.1
- **Signing**: Automated Debug Keystore (RSA 2048)

*Notice: This is a debug development build intended for testing.*
EOF

          sed -i "s/__ASSET_NAME__/$ASSET_NAME/g" release_notes.md
          sed -i "s/__APK_SIZE__/$APK_SIZE/g" release_notes.md
          sed -i "s/__APK_SHA256__/$APK_SHA256/g" release_notes.md
          sed -i "s/__RUN_NUMBER__/$GITHUB_RUN_NUMBER/g" release_notes.md
          sed -i "s/__RUN_ATTEMPT__/$GITHUB_RUN_ATTEMPT/g" release_notes.md
          sed -i "s/__GIT_SHA__/$GITHUB_SHA/g" release_notes.md
          
          echo "Publishing release with tag: $RELEASE_TAG and title: $RELEASE_TITLE..."
          if gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file "release_notes.md" \
            --target "$GITHUB_SHA" \
            --latest; then
            echo "Successfully published GitHub Release $RELEASE_TAG"
            echo "### Build and Release Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Debug APK build**: Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Actions artifact upload**: Succeeded (\`app-debug-apk\`)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **GitHub Release**: Succeeded (\`$RELEASE_TAG\`)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Failed to publish release with GitHub CLI."
            echo "### Build and Release Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Debug APK build**: Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Actions artifact upload**: Succeeded (\`app-debug-apk\`)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **GitHub Release**: Failed (see step logs for error details)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
